# Малює «змійку», що з'їдає календар комітів, і кладе SVG у гілку `output`,
# звідки README показує її. Раз на день, після кожного push і вручну.
name: Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7b2ff7&color_dots=#ebedf0,#e9d5ff,#c86bfa,#9b4dfa,#7b2ff7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c86bfa&color_dots=#161b22,#3b1f5e,#6d32b8,#9b4dfa,#c86bfa

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
