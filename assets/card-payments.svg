<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 170" width="440" height="170" role="img" aria-label="Payment Fulfilment">
  <style>
    .t    { font: 700 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
    .d    { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #9ea7b3; }
    .chip { font: 600 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #4ade80; }
    .b    { font: 600 10.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 3.2s ease-in-out infinite; }
    .scan { animation: scan 4s ease-in-out infinite; }
    @keyframes ring { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .9; transform: scale(1.12); } }
    @keyframes scan { 0% { transform: translateX(-140px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(480px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0b1f14"/></linearGradient>
    <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#4ade80" stop-opacity="0"/><stop offset=".5" stop-color="#4ade80" stop-opacity=".9"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="438" height="168" rx="16"/></clipPath>
  </defs>
  <rect x="1" y="1" width="438" height="168" rx="16" fill="url(#bg)" stroke="#238636" stroke-width="1.5"/>
  <g clip-path="url(#clip)"><rect class="scan" x="0" y="1" width="120" height="2.5" fill="url(#sheen)"/></g>
  <g transform="translate(48,52)">
    <circle r="27" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <circle class="ring" r="31" fill="none" stroke="#4ade80" stroke-width="1"/>
    <g fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-16" y="-11" width="32" height="22" rx="4"/><path d="M-16 -4H16"/><path d="M-10 5H-3"/><circle cx="9" cy="5" r="2.2"/></g>
  </g>
  <text x="92" y="44" class="t">Payment Fulfilment</text>
  <g transform="translate(363,24)"><rect width="59" height="20" rx="10" fill="none" stroke="#8b949e" stroke-opacity=".6"/><text x="29.5" y="14" text-anchor="middle" class="b">private</text></g>
  <text x="92" y="74" class="d">Verifies incoming payments and delivers</text>
  <text x="92" y="93" class="d">purchases automatically, end to end</text>
  <g transform="translate(92,126)"><rect width="56" height="22" rx="11" fill="#0e4429"/><text x="28" y="15" text-anchor="middle" class="chip">Python</text></g><g transform="translate(154,126)"><rect width="63" height="22" rx="11" fill="#0e4429"/><text x="31.5" y="15" text-anchor="middle" class="chip">asyncio</text></g><g transform="translate(223,126)"><rect width="82" height="22" rx="11" fill="#0e4429"/><text x="41" y="15" text-anchor="middle" class="chip">PostgreSQL</text></g><g transform="translate(311,126)"><rect width="44" height="22" rx="11" fill="#0e4429"/><text x="22" y="15" text-anchor="middle" class="chip">REST</text></g>
</svg>
