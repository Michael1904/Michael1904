<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 170" width="440" height="170" role="img" aria-label="Hotel Booking">
  <style>
    .t    { font: 700 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
    .d    { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #9ea7b3; }
    .chip { font: 600 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #4ade80; }
    .b    { font: 600 10.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #4ade80; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 3.2s ease-in-out infinite; }
    .scan { animation: scan 4s ease-in-out infinite; }
    @keyframes ring { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .9; transform: scale(1.12); } }
    @keyframes scan { 0% { transform: translateX(-140px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(480px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0b1f14"/></linearGradient>
    <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#4ade80" stop-opacity="0"/><stop offset=".5" stop-color="#4ade80" stop-opacity=".9"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="438" height="168" rx="16"/></clipPath>
  </defs>
  <rect x="1" y="1" width="438" height="168" rx="16" fill="url(#bg)" stroke="#238636" stroke-width="1.5"/>
  <g clip-path="url(#clip)"><rect class="scan" x="0" y="1" width="120" height="2.5" fill="url(#sheen)"/></g>
  <g transform="translate(48,52)">
    <circle r="27" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <circle class="ring" r="31" fill="none" stroke="#4ade80" stroke-width="1"/>
    <g fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 10V-10M-16 3H16V10M16 3V-1C16 -4 14 -6 11 -6H-2V3"/><circle cx="-9" cy="-2" r="3.5"/></g>
  </g>
  <text x="92" y="44" class="t">Hotel Booking</text>
  <g transform="translate(325,24)"><rect width="97" height="20" rx="10" fill="none" stroke="#4ade80" stroke-opacity=".6"/><text x="48.5" y="14" text-anchor="middle" class="b">open source ↗</text></g>
  <text x="92" y="74" class="d">Bilingual booking site with a REST API,</text>
  <text x="92" y="93" class="d">JWT auth and email notifications</text>
  <g transform="translate(92,126)"><rect width="63" height="22" rx="11" fill="#0e4429"/><text x="31.5" y="15" text-anchor="middle" class="chip">Next.js</text></g><g transform="translate(161,126)"><rect width="63" height="22" rx="11" fill="#0e4429"/><text x="31.5" y="15" text-anchor="middle" class="chip">Express</text></g><g transform="translate(230,126)"><rect width="56" height="22" rx="11" fill="#0e4429"/><text x="28" y="15" text-anchor="middle" class="chip">SQLite</text></g><g transform="translate(292,126)"><rect width="37" height="22" rx="11" fill="#0e4429"/><text x="18.5" y="15" text-anchor="middle" class="chip">JWT</text></g>
</svg>
