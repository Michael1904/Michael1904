<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420" role="img" aria-label="Animated tree">
  <style>
    .sway   { transform-box: view-box; transform-origin: 200px 400px; animation: sway 7s ease-in-out infinite; }
    .c1     { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; }
    .c2     { transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out -1.5s infinite; }
    .c3     { transform-box: fill-box; transform-origin: center; animation: breathe 5.5s ease-in-out -3s infinite; }
    .leaf   { transform-box: fill-box; transform-origin: center; opacity: 0; }
    .l1 { animation: fall1 9s linear 0s infinite; }
    .l2 { animation: fall2 11s linear 2.5s infinite; }
    .l3 { animation: fall1 10s linear 5s infinite; }
    .l4 { animation: fall2 12s linear 7s infinite; }
    .l5 { animation: fall1 9.5s linear 3.8s infinite; }
    .fly    { animation: glow 3s ease-in-out infinite; }
    .f2 { animation-delay: -0.8s; } .f3 { animation-delay: -1.6s; } .f4 { animation-delay: -2.2s; } .f5 { animation-delay: -1.1s; }
    .ground { animation: shimmer 6s ease-in-out infinite; }

    @keyframes sway    { 0%,100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    @keyframes fall1 {
      0%   { opacity: 0; transform: translate(0,0) rotate(0deg); }
      8%   { opacity: 1; }
      50%  { transform: translate(-28px,120px) rotate(160deg); }
      90%  { opacity: 1; }
      100% { opacity: 0; transform: translate(14px,230px) rotate(340deg); }
    }
    @keyframes fall2 {
      0%   { opacity: 0; transform: translate(0,0) rotate(0deg); }
      8%   { opacity: 1; }
      50%  { transform: translate(30px,110px) rotate(-150deg); }
      90%  { opacity: 1; }
      100% { opacity: 0; transform: translate(-10px,220px) rotate(-320deg); }
    }
    @keyframes glow    { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes shimmer { 0%,100% { opacity: .55; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .leaf { opacity: 0; } }
  </style>

  <defs>
    <radialGradient id="leafA" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#86efac"/><stop offset=".55" stop-color="#22c55e"/><stop offset="1" stop-color="#15803d"/>
    </radialGradient>
    <radialGradient id="leafB" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#4ade80"/><stop offset=".6" stop-color="#16a34a"/><stop offset="1" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="leafC" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#bbf7d0"/><stop offset=".5" stop-color="#4ade80"/><stop offset="1" stop-color="#166534"/>
    </radialGradient>
    <linearGradient id="bark" x1="0" x2="1">
      <stop offset="0" stop-color="#5b3a1e"/><stop offset=".5" stop-color="#7c5230"/><stop offset="1" stop-color="#4a2f17"/>
    </linearGradient>
    <radialGradient id="flyGlow">
      <stop offset="0" stop-color="#ecfccb"/><stop offset=".35" stop-color="#a3e635" stop-opacity=".8"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <path id="leafShape" d="M0 -7 C5 -5 6 3 0 8 C-6 3 -5 -5 0 -7 Z"/>
  </defs>

  <!-- soft ground glow -->
  <ellipse class="ground" cx="200" cy="404" rx="120" ry="10" fill="#22c55e" opacity=".6"/>
  <ellipse cx="200" cy="404" rx="70" ry="5" fill="#14532d" opacity=".7"/>

  <g class="sway">
    <!-- trunk and branches -->
    <path d="M182 405 C186 360 182 320 174 296 L190 290 C196 312 200 330 200 350
             C200 330 204 312 210 290 L226 296 C218 320 214 360 218 405 Z" fill="url(#bark)"/>
    <path d="M178 300 C160 280 140 262 112 250" fill="none" stroke="url(#bark)" stroke-width="11" stroke-linecap="round"/>
    <path d="M222 300 C242 278 262 262 290 248" fill="none" stroke="url(#bark)" stroke-width="11" stroke-linecap="round"/>
    <path d="M196 292 C194 260 192 230 196 196" fill="none" stroke="url(#bark)" stroke-width="10" stroke-linecap="round"/>
    <path d="M140 262 C130 240 128 222 132 206" fill="none" stroke="url(#bark)" stroke-width="6" stroke-linecap="round"/>
    <path d="M262 262 C272 242 276 222 272 204" fill="none" stroke="url(#bark)" stroke-width="6" stroke-linecap="round"/>

    <!-- canopy, back to front -->
    <g class="c2">
      <circle cx="110" cy="232" r="52" fill="url(#leafB)"/>
      <circle cx="292" cy="230" r="54" fill="url(#leafB)"/>
      <circle cx="200" cy="120" r="66" fill="url(#leafB)"/>
    </g>
    <g class="c1">
      <circle cx="150" cy="170" r="62" fill="url(#leafA)"/>
      <circle cx="252" cy="168" r="64" fill="url(#leafA)"/>
      <circle cx="200" cy="215" r="70" fill="url(#leafA)"/>
    </g>
    <g class="c3">
      <circle cx="132" cy="214" r="40" fill="url(#leafC)" opacity=".9"/>
      <circle cx="268" cy="206" r="42" fill="url(#leafC)" opacity=".9"/>
      <circle cx="190" cy="150" r="44" fill="url(#leafC)" opacity=".85"/>
      <circle cx="232" cy="240" r="34" fill="url(#leafC)" opacity=".8"/>
    </g>

    <!-- highlights -->
    <circle cx="176" cy="120" r="10" fill="#dcfce7" opacity=".35"/>
    <circle cx="238" cy="150" r="7"  fill="#dcfce7" opacity=".3"/>
    <circle cx="124" cy="196" r="6"  fill="#dcfce7" opacity=".3"/>

    <!-- falling leaves start inside the canopy -->
    <use href="#leafShape" class="leaf l1" x="150" y="250" fill="#4ade80"/>
    <use href="#leafShape" class="leaf l2" x="250" y="245" fill="#86efac"/>
    <use href="#leafShape" class="leaf l3" x="205" y="270" fill="#22c55e"/>
    <use href="#leafShape" class="leaf l4" x="115" y="265" fill="#a3e635"/>
    <use href="#leafShape" class="leaf l5" x="285" y="262" fill="#4ade80"/>
  </g>

  <!-- fireflies -->
  <circle class="fly"    cx="70"  cy="150" r="9" fill="url(#flyGlow)"/>
  <circle class="fly f2" cx="340" cy="120" r="8" fill="url(#flyGlow)"/>
  <circle class="fly f3" cx="330" cy="300" r="9" fill="url(#flyGlow)"/>
  <circle class="fly f4" cx="60"  cy="320" r="7" fill="url(#flyGlow)"/>
  <circle class="fly f5" cx="200" cy="40"  r="8" fill="url(#flyGlow)"/>
</svg>
