<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-label="Animated tree">
  <style>
    .tree  { transform-box: view-box; transform-origin: 210px 400px; animation: sway 8s ease-in-out infinite; }
    .s1    { transform-box: fill-box; transform-origin: center; animation: rustle 6s ease-in-out infinite; }
    .s2    { transform-box: fill-box; transform-origin: center; animation: rustle 5s ease-in-out -2s infinite; }
    .s3    { transform-box: fill-box; transform-origin: center; animation: rustle 7s ease-in-out -4s infinite; }
    .fall  { opacity: 0; animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
    .drift { animation-name: drift; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .fly   { animation: blink 3.2s ease-in-out infinite; }
    .grass path { fill: none; stroke-width: 1.6; stroke-linecap: round; }
    .grass { transform-box: view-box; transform-origin: 210px 402px; animation: sway 5s ease-in-out -1s infinite; }

    @keyframes sway   { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
    @keyframes rustle { 0%,100% { transform: scale(1) translate(0,0); } 50% { transform: scale(1.025) translate(1.5px,-1px); } }
    @keyframes fall {
      0%   { opacity: 0; transform: translate(0,0) rotate(0deg); }
      10%  { opacity: 1; }
      55%  { transform: translate(var(--dx),100px) rotate(200deg); }
      88%  { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(var(--dx) * -0.4),150px) rotate(380deg); }
    }
    @keyframes drift  { 0%,100% { transform: translate(0,0); } 33% { transform: translate(10px,-14px); } 66% { transform: translate(-8px,-6px); } }
    @keyframes blink  { 0%,100% { opacity: .1; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fall { opacity: 0; } }
  </style>
  <defs>
    <radialGradient id="g0" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#166534"/><stop offset="1" stop-color="#052e16"/></radialGradient>
